<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DeepSeek Status</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="offpeak">
  <header id="hero" class="pywebview-drag-region">
    <button id="closeBtn" title="Fermer (Échap)">✕</button>
    <div class="chip" id="chip">—</div>
    <div class="scene">
      <div class="swimmer"><svg id="whale" viewBox="0 0 24 24" aria-hidden="true"><path id="whalePath" d=""/></svg></div>
      <div class="bubbles"><i></i><i></i><i></i><i></i></div>
      <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
      <div id="previewBanner" hidden>
        <span>Mode aperçu — compte à rebours réel</span>
        <button id="exitPreview">quitter</button>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="row">
        <span class="label" id="nextLabel">—</span>
        <span class="clock"><span id="beijingClock">—</span> <small>Pékin</small></span>
      </div>
      <div class="big" id="countdown">--:--:--</div>
      <div class="sub" id="nextAt">—</div>
      <div class="progress"><div id="progressFill"></div></div>
      <div class="meta" id="progressMeta">—</div>
    </section>

    <section class="card prices">
      <div class="price-row">
        <span class="dot peak-dot"></span><span class="pname">Plein tarif</span>
        <span class="mult">×1,0</span>
        <div class="bar"><i class="bar-peak" style="width:100%"></i></div>
      </div>
      <div class="price-row">
        <span class="dot off-dot"></span><span class="pname">Heures creuses</span>
        <span class="mult">×0,5</span>
        <div class="bar"><i class="bar-off" style="width:50%"></i></div>
      </div>
      <div class="hint">Hors pointe = moitié du prix de pointe (règle officielle DeepSeek).</div>
    </section>

    <section class="card">
      <div class="label">Semaine type — heure de Pékin</div>
      <div class="weekwrap">
        <div id="dayCol"></div>
        <div id="weekGrid"></div>
      </div>
      <div class="hours-row"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>24h</span></div>
      <div class="legend"><span class="sw sw-peak"></span>plein&nbsp;<span class="sw sw-off"></span>creux</div>
    </section>

    <section class="card settings">
      <div class="label">Aperçu <small>(affichage uniquement)</small></div>
      <div class="pills" id="pills">
        <button data-mode="">Temps réel</button>
        <button data-mode="peak">Plein</button>
        <button data-mode="offPeak">Creux</button>
      </div>
      <label class="toggle-row">
        <span>Démarrer avec Windows</span>
        <span class="toggle"><input type="checkbox" id="loginToggle"><i></i></span>
      </label>
    </section>
  </main>

  <footer>
    <span id="tzNote">—</span><span class="sep">·</span><span id="beijingDate">—</span><span class="sep">·</span><span id="ver">v—</span>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
